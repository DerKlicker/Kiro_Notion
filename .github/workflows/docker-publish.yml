# =============================================================================
# App-Image bauen und nach GHCR veroeffentlichen (Phase 4)
# =============================================================================
# Baut das Vereinsstatistik-Image und pusht es in die GitHub Container Registry
# unter ghcr.io/derklicker/kiro_notion. Dieses Image enthaelt nur Programmcode
# und die Referenz-Vorlage (config.example.yaml) - KEINE Secrets, keine
# config.yaml, keine .env, keine Mitgliederdaten (siehe .dockerignore).
#
# Hinweis: Nach dem allerersten Push muss die Sichtbarkeit des GHCR-Pakets im
# GitHub-Projekt ggf. einmalig manuell auf "public" gestellt werden
# (Repo -> Packages -> kiro_notion -> Package settings -> Visibility).
# =============================================================================

name: Docker-Image veroeffentlichen (GHCR)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: derklicker/kiro_notion

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Bei GHCR anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten/Tags bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
