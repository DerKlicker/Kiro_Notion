# =============================================================================
# Vereinsstatistik - TrueNAS Custom App (einmal einrichten, dann nur "Update")
# =============================================================================
# EINRICHTUNG: Du musst GENAU ZWEI Werte eintragen - jeweils nur EINMAL, ganz
# oben im Block "x-einstellungen". Der Rest zieht sich die Werte automatisch
# ueber YAML-Anker (die *sterne unten). Danach nie wieder anfassen:
# fuer neue Funktionen in TrueNAS einfach auf "Update" klicken.
#
#   (1) HIER_DEIN_DB_PASSWORT   -> ein starkes, selbst gewaehltes Passwort.
#                                  Keine $ " ` Zeichen verwenden.
#   (2) HIER_DEIN_NOTION_TOKEN  -> dein Notion-Integration-Token (ntn_...).
#
# Das Image wird als :latest gezogen (pull_policy: always), d. h. beim "Update"
# in TrueNAS kommt automatisch die neueste Version. Kein sha-Tag mehr noetig.
#
# Das GHCR-Image enthaelt nur Programmcode - keine Secrets. Deine Werte bleiben
# in diesem YAML auf deinem NAS. Vollstaendige Anleitung: docs/TRUENAS-APP.md.
# =============================================================================

# ----------------------------------------------------------------------------
# HIER die zwei Werte eintragen (je EINMAL). Sie werden unten per *Anker
# ueberall eingesetzt - du musst sie NICHT mehrfach kopieren.
# ----------------------------------------------------------------------------
x-einstellungen:
  db-passwort: &db_passwort "HIER_DEIN_DB_PASSWORT"
  notion-token: &notion_token "HIER_DEIN_NOTION_TOKEN"
  # Sync-Intervall in Sekunden (86400 = taeglich, 3600 = stuendlich):
  sync-intervall: &sync_intervall "86400"

services:

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: vereinsstatistik
      POSTGRES_USER: verein
      POSTGRES_PASSWORD: *db_passwort
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verein -d vereinsstatistik"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vereinsstatistik

  app:
    image: ghcr.io/derklicker/kiro_notion:latest
    # Beim "Update" immer das neue :latest ziehen (kein manuelles docker pull).
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NOTION_TOKEN: *notion_token
      PG_PASSWORD: *db_passwort
      # PostgreSQL dauerhaft aktivieren (Vorrang vor der config.yaml), damit die
      # DB-Anbindung auch nach Neuanlage/Update gesetzt bleibt - ohne Shell.
      PG_ENABLED: "true"
      PG_HOST: "postgres"
      VEREINSSTATISTIK_CONFIG_DIR: /app/config_dir
    volumes:
      - config-dir:/app/config_dir
    ports:
      - "8000:8000"
    networks:
      - vereinsstatistik

  etl-cron:
    image: ghcr.io/derklicker/kiro_notion:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NOTION_TOKEN: *notion_token
      PG_PASSWORD: *db_passwort
      PG_ENABLED: "true"
      PG_HOST: "postgres"
      SYNC_INTERVALL_SEKUNDEN: *sync_intervall
      VEREINSSTATISTIK_CONFIG_DIR: /app/config_dir
    volumes:
      - config-dir:/app/config_dir:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        python -m vereinsstatistik.cli init-db;
        while true; do
          python -m vereinsstatistik.cli sync || true;
          sleep "$${SYNC_INTERVALL_SEKUNDEN:-86400}";
        done
    networks:
      - vereinsstatistik

  grafana-provisioning-init:
    image: ghcr.io/derklicker/kiro_notion:latest
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mkdir -p /provisioning &&
        cp -r /app/grafana/provisioning/. /provisioning/
    volumes:
      - grafana-provisioning:/provisioning
    networks:
      - vereinsstatistik

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      grafana-provisioning-init:
        condition: service_completed_successfully
    environment:
      PG_PASSWORD: *db_passwort
    volumes:
      - grafana-data:/var/lib/grafana
      - grafana-provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - vereinsstatistik

volumes:
  postgres-data:
  grafana-data:
  config-dir:
  grafana-provisioning:

networks:
  vereinsstatistik:
    driver: bridge
