# =============================================================================
# Vereinsstatistik - Docker-Compose-Stack (Phase 3, Ziel: TrueNAS SCALE)
# =============================================================================
# Drei Hauptdienste plus ein optionaler Sync-Dienst:
#   * postgres  - dedizierte PostgreSQL-Datenbank fuer dieses Tool.
#   * app       - Web-UI (Port 8000) und ETL-CLI aus dem lokalen Dockerfile.
#   * etl-cron  - gleiches Image wie app, fuehrt periodisch "sync" aus.
#   * grafana   - Dashboards, liest aus der PostgreSQL-Datenbank.
#
# Secrets kommen aus der .env (NOTION_TOKEN, PG_PASSWORD) und werden hier NUR
# ueber ${...} referenziert - niemals hart im Compose hinterlegt.
#
# Hinweis zur Container-Konfiguration: in config.yaml muss postgres.host auf
# den Service-Namen "postgres" stehen (nicht "localhost"), damit die App die
# DB im Compose-Netzwerk erreicht. Details dazu in docs/TRUENAS.md (FEAT-004).
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL - persistente, dedizierte Datenbank nur fuer dieses Tool.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      # Muss zu config.yaml (database/user) und PG_PASSWORD passen.
      POSTGRES_DB: vereinsstatistik
      POSTGRES_USER: verein
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready meldet "healthy", sobald die DB Verbindungen annimmt.
      test: ["CMD-SHELL", "pg_isready -U verein -d vereinsstatistik"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vereinsstatistik

  # ---------------------------------------------------------------------------
  # App - Web-UI zum Pflegen der Konfiguration (Port 8000).
  # Das gleiche Image wird fuer die ETL-Kommandos (init-db/sync) genutzt.
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vereinsstatistik:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Secrets aus der .env. Die App liest NOTION_TOKEN und PG_PASSWORD
      # direkt aus der Umgebung (siehe config.Config).
      NOTION_TOKEN: ${NOTION_TOKEN}
      PG_PASSWORD: ${PG_PASSWORD}
    volumes:
      # config.yaml zur Laufzeit einhaengen (read-write, da die Web-UI
      # Aenderungen zurueckschreibt). Vorlage: config.example.yaml.
      - ./config.yaml:/app/config.yaml
    ports:
      - "8000:8000"
    networks:
      - vereinsstatistik

  # ---------------------------------------------------------------------------
  # ETL-Cron - periodischer Sync Notion -> PostgreSQL.
  # Gewaehlte Loesung: eigener Dienst mit gleichem Image. Er legt beim Start
  # einmalig das Schema an (init-db, idempotent) und ruft danach in einer
  # Schleife "sync" auf. Das Intervall steuert SYNC_INTERVALL_SEKUNDEN
  # (Standard 86400 = einmal taeglich). So braucht TrueNAS keinen externen
  # Cron-Job; wer lieber den Host-Cron nutzt, kann diesen Dienst weglassen
  # und stattdessen "docker compose run --rm app sync" planen (siehe Doku).
  # ---------------------------------------------------------------------------
  etl-cron:
    image: vereinsstatistik:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NOTION_TOKEN: ${NOTION_TOKEN}
      PG_PASSWORD: ${PG_PASSWORD}
      SYNC_INTERVALL_SEKUNDEN: ${SYNC_INTERVALL_SEKUNDEN:-86400}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    # Schema anlegen, dann endlos im Intervall synchronisieren. Fehlgeschlagene
    # Laeufe brechen die Schleife nicht ab (|| true), der naechste Lauf folgt.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        python -m vereinsstatistik.cli init-db;
        while true; do
          python -m vereinsstatistik.cli sync || true;
          sleep "${SYNC_INTERVALL_SEKUNDEN:-86400}";
        done
    networks:
      - vereinsstatistik

  # ---------------------------------------------------------------------------
  # Grafana - Visualisierung. Liest die aufbereiteten Kennzahlen aus Postgres.
  # Das Provisioning-Verzeichnis (Datenquelle + Dashboards) kommt aus FEAT-004.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # PostgreSQL-Passwort auch fuer die Grafana-Datenquelle verfuegbar
      # machen (wird in der Provisioning-YAML als ${PG_PASSWORD} referenziert).
      PG_PASSWORD: ${PG_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      # Provisioning (Datenquelle + Dashboards) - Inhalt liefert FEAT-004.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - vereinsstatistik

# -----------------------------------------------------------------------------
# Persistente benannte Volumes. Bleiben ueber Neustarts/Updates erhalten.
# -----------------------------------------------------------------------------
volumes:
  postgres-data:
  grafana-data:

# -----------------------------------------------------------------------------
# Gemeinsames Bridge-Netzwerk fuer alle Dienste.
# -----------------------------------------------------------------------------
networks:
  vereinsstatistik:
    driver: bridge
